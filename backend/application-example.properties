# Local development settings.
#
# Copy this file to application-local.properties in this same backend folder, then
# fill in your real values. Git ignores application-local.properties, so your
# password never gets committed.
#
#   cp application-example.properties application-local.properties
#
# The app reads application.properties first and then layers these values on top.

# Your local database password. This is usually the only thing you need to set.
spring.datasource.password=put-your-local-password-here

# Uncomment and change these only if your local setup differs from the defaults
# already in application.properties.
# spring.datasource.url=jdbc:postgresql://localhost:5432/modernization
# spring.datasource.username=modernization_app
