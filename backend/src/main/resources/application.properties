# Application identity
spring.application.name=modernization

# Maven fills in the real version here at build time, so the /health endpoint can
# report which build is running. See how AppInfoService uses app.version.
app.version=@project.version@

# ---- Database connection ----
# These read from environment variables first, with sensible localhost defaults.
# For local work the only thing you usually need is the password: copy
# application-example.properties to application-local.properties (Git ignores it)
# and set it there. In production we pass these in as real environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/modernization}
spring.datasource.username=${DB_USERNAME:modernization_app}
spring.datasource.password=${DB_PASSWORD:}

# ---- JPA / Hibernate ----
# Flyway owns the database schema. Hibernate must never change it on its own.
# "validate" means Hibernate only checks that our Java entities line up with the
# real tables and fails fast if they ever drift apart.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Flyway (database migrations) ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---- Server ----
server.port=${SERVER_PORT:8080}

# ---- Local-only overrides ----
# Load application-local.properties from this backend folder if it is there. It is
# optional and Git ignores it, so it is the safe place to keep local secrets.
spring.config.import=optional:file:./application-local.properties


# ---- Security: sign-in tokens (JWT) ----
# The signing secret must be at least 32 characters and is required. Keep it in
# application-local.properties for local work, or an environment variable in prod.
app.security.jwt.secret=${APP_JWT_SECRET}
app.security.jwt.issuer=corewise-modernization
app.security.jwt.expiry=PT8H

# ---- First admin account ----
# When the users table is empty, we create one admin from these so someone can sign
# in the first time. Set them in application-local.properties or env. If left blank,
# we skip seeding and you can create the admin another way.
app.bootstrap.admin-email=${APP_ADMIN_EMAIL:}
app.bootstrap.admin-password=${APP_ADMIN_PASSWORD:}
app.bootstrap.admin-name=${APP_ADMIN_NAME:Admin}


# ---- File storage and uploads ----
# Where uploaded source files are kept on disk. In production point this at a real
# data volume that gets backed up.
app.storage.root=${APP_STORAGE_ROOT:var/storage}
# Allow large uploads. The small threshold means files spill to a temp file on disk
# instead of being held in memory, so a big upload does not eat the heap.
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=200MB
spring.servlet.multipart.file-size-threshold=2KB


# ---- AI reading service ----
# Which hosted AI to use: claude or openai. Keys live in application-local.properties
# or environment variables, never in code. The app starts fine without a key; AI
# calls just fail with a clear message until a key is set.
app.ai.provider=${APP_AI_PROVIDER:claude}
app.ai.timeout=PT30S
app.ai.max-attempts=3
app.ai.initial-backoff=PT1S
app.ai.claude.api-key=${APP_AI_CLAUDE_KEY:}
app.ai.claude.model=${APP_AI_CLAUDE_MODEL:claude-3-5-sonnet-latest}
app.ai.openai.api-key=${APP_AI_OPENAI_KEY:}
app.ai.openai.model=${APP_AI_OPENAI_MODEL:gpt-4o}
